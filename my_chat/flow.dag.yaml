$schema: https://azuremlschemas.azureedge.net/promptflow/latest/Flow.schema.json
environment:
  python_requirements_txt: requirements.txt
inputs:
  question:
    type: string
    is_chat_input: true
  thread_id:
    type: string
    default: ""
  agent_id:
    type: string
outputs:
  answer:
    type: string
    reference: ${call_agent.output.answer}
    is_chat_output: true
  thread_id:
    type: string
    reference: ${call_agent.output.thread_id}
nodes:
- name: call_agent
  type: python
  source:
    type: code
    path: agent_node.py
  inputs:
    question: ${inputs.question}
    thread_id: ${inputs.thread_id}
    agent_id: ${inputs.agent_id}
